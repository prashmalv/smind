[project]
name = "shoppermind-api"
version = "0.1.0"
description = "ShopperMind AI — shopper intelligence platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "azure-storage-blob>=12.23",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
